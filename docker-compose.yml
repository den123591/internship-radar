services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 3s
      retries: 10

  # Одноразовая задача: наполнить БД снимком вакансий из репозитория.
  # Для свежих данных: docker compose run --rm seed radar ingest --source habr
  seed:
    build: .
    command: radar ingest --source sample
    environment:
      RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
